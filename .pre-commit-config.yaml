repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
    exclude: ^(ThirdParty/doctest/src/scripts/version.txt)$
  - id: trailing-whitespace
    exclude: ^(ThirdParty/doctest/src/scripts/version.txt)$

- repo: https://github.com/psf/black-pre-commit-mirror
  rev: 26.5.1
  hooks:
  - id: black
    exclude: ^ThirdParty/
