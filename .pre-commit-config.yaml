repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v2.3.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
    exclude: ^(ThirdParty/doctest/src/scripts/version.txt)$
  - id: trailing-whitespace
    exclude: ^(ThirdParty/doctest/src/scripts/version.txt)$

- repo: https://github.com/psf/black
  rev: 24.4.2
  hooks:
  - id: black
    exclude: ^ThirdParty/
