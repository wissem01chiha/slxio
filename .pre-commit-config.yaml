repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v2.3.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
    exclude: ^version\.txt$
  - id: trailing-whitespace
    exclude: ^version\.txt$

- repo: https://github.com/psf/black
  rev: 22.10.0
  hooks:
  - id: black
    exclude: ^(ThirdParty/doctest/src/scripts/version.txt)$
