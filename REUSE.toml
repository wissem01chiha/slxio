  ".github/**",
  ".gitattributes",
  ".gitignore",
  ".clang-format",
  ".codacy.yml",
  ".gitmodules",
  ".pre-commit-config.yaml",
  "*.md",
  "*.txt",
  "*.yml",
  "*.yaml",
  "*.json",
  "*.toml",
  "*.in",
  "cmake/**",
  "conan/**",
  "documentation/**",
  "examples/**",
  "python/**",
  "regress/**",
  "test/**",
  "tools/**",
  "CTestConfig.cmake",
  "vendor/CMakeLists.txt",
  "vendor/*/CMakeLists.txt",
  "vendor/*/*.h",
  "vendor/*/update.sh",
