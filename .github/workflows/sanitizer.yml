name: Sanitizer

on:
  push:
  pull_request:

jobs:
  cmake:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC UndefinedBehaviorSanitizer
            os: ubuntu-latest
            compiler: gcc
            cxx-compiler: g++
            cmake-args: -DCMAKE_CXX_STANDARD=17 -DSLXIO_SANITIZERS=ON -DSLXIO_UBSAN=ON

          - name: GCC AddressSanitizer 
            os: ubuntu-latest
            compiler: gcc
            cxx-compiler: g++
            cmake-args: -DCMAKE_CXX_STANDARD=17 -DSLXIO_SANITIZERS=ON -DSLXIO_ASAN=ON

          - name: GCC ThreadSanitizer
            os: ubuntu-latest
            compiler: gcc
            cxx-compiler: g++
            cmake-args: -DCMAKE_CXX_STANDARD=17 -DSLXIO_SANITIZERS=ON  -DSLXIO_TSAN=ON

          - name: GCC MemorySanitizer
            os: ubuntu-latest
            compiler: gcc
            cxx-compiler: g++
            cmake-args: -DCMAKE_CXX_STANDARD=17 -DSLXIO_SANITIZERS=ON  -DSLXIO_MSAN=ON
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install packages
        if: ${{ matrix.packages }}
        run: sudo apt-get update && sudo apt-get install -y ${{ join(matrix.packages, ' ') }}

      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake-args }}
        env:
          CC: ${{ matrix.compiler }}
          CXX: ${{ matrix.cxx-compiler }}
          CFLAGS: ${{ matrix.cflags }}

      - name: Compile
        run: cmake --build build

      - name: Upload Build Folder
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: build/

      - name: Test
        run: ctest --output-on-failure --max-width 150
        working-directory: build
