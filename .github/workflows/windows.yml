name: Windows
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  cmake:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: msvc
            cxx-compiler: cl
            platform: Win32
            configuration: Debug
            os: windows-latest
            python-version: 3.12
            python-arch: x86
            name: Windows MSVC Win32 Debug
            cmake-args: -A Win32 -G "Visual Studio 17 2022" -DCMAKE_CXX_STANDARD=14 -DCMAKE_BUILD_TYPE=Debug

          - compiler: msvc
            cxx-compiler: cl
            platform: x64
            configuration: Release
            os: windows-latest
            python-version: 3.12
            python-arch: x64
            name: Windows MSVC x64 Release
            cmake-args: -A x64 -G "Visual Studio 17 2022" -DCMAKE_CXX_STANDARD=14 -DCMAKE_BUILD_TYPE=Release

          - compiler: clang
            cxx-compiler: clang++
            platform: Win32
            configuration: Debug
            os: windows-latest
            python-version: 3.12
            python-arch: x86
            name: Windows Clang Win32 Debug
            cmake-args: -G Ninja -DCMAKE_CXX_STANDARD=14 -DCMAKE_BUILD_TYPE=Debug

          - compiler: clang
            cxx-compiler: clang++
            platform: x64
            configuration: Release
            os: windows-latest
            python-version: 3.12
            python-arch: x64
            name: Windows Clang x64 Release
            cmake-args: -G Ninja -DCMAKE_CXX_STANDARD=14 -DCMAKE_BUILD_TYPE=Release


    steps:
        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: ${{ matrix.python-version }}
            architecture: ${{ matrix.python-arch }}

        - name: Install MSVC Build Tools
          if: ${{ matrix.compiler == 'msvc' }}
          run: choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --includeOptional --passive --locale en-US"

        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Configure
          run: >
            cmake -S . -B build
            ${{ matrix.cmake-args }}
            -DPython_EXECUTABLE=${{ steps.setup-python.outputs.python-path }}
          env:
            CC: ${{ matrix.compiler }}
            CXX: ${{ matrix.cxx-compiler }}

        - name: Build
          run: cmake --build build

        - name: Test
          run: ctest -C ${{ matrix.configuration }} --output-on-failure --max-width 150
          working-directory: build