name: Documentation
on:
  push:
    branches: ["master"]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install latest Doxygen
        run: |
          DOXYGEN_VERSION=1.16.1
          wget https://doxygen.nl/files/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz
          tar -xzf doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz
          sudo mv doxygen-${DOXYGEN_VERSION}/bin/doxygen /usr/local/bin/doxygen
          doxygen --version

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release  -DSLXIO_DOXYGEN_DOCUMENTATION=ON -DSLXIO_BUILD_TESTS=OFF

      - name: Build Documentation
        run: cmake --build ${{github.workspace}}/build --target Documentation

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{github.workspace}}/build/Utilities/Doxygen/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
