name: Validate Release String
description: >
  Checks that the given release-version string is well formed.
  See https://semver.org/ for details.
inputs:
  release-version:
    required: true
runs:
  using: "composite"
  steps:
    - name: Validate version string
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.release-version }}
      run: |
        if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$' <<< "$RELEASE_VERSION"; then
          echo "Invalid release version: $RELEASE_VERSION"
          exit 1
        fi
        echo "Release version $RELEASE_VERSION is valid."